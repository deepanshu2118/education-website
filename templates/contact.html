{% extends "base.html" %}

{% block content %}
<section class="contact">
    <div class="container">
        <h1>Contact Me</h1>
        <p>Have questions or suggestions? Fill out the form below or reach me directly.</p>

        <form id="contactForm" class="contact-form">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="email">Your Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="mobile">Mobile</label>
                <input type="text" id="mobile" name="mobile" placeholder="Enter your mobile number" required>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" placeholder="Write your message" required></textarea>
            </div>

            <button type="submit" class="btn">Send Message</button>
        </form>

        <div class="contact-info">
            <h3>Other Ways to Reach Me</h3>
            <p>Email: <a href="mailto:deepanshumangal2002@gmail.com">deepanshumangal2002@gmail.com</a></p>
            <p>GitHub: <a href="https://github.com/deepanshu2118" target="_blank">github.com/deepanshu2118</a></p>
            <p>Mobile: <a href="tel:+917240372118">+91 7240372118</a></p>
        </div>
    </div>
</section>

<script>
document.getElementById("contactForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const formData = {
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    mobile: document.getElementById("mobile").value,
    message: document.getElementById("message").value,
  };

  fetch("https://script.google.com/macros/s/AKfycbyRS_85o24XkDZSnioxEo4H1d7eDywGeyhZoYGX-M9dnyLuvdRYAxKlbTcl1hlTfYC8/exec", {
    method: "POST",
    body: JSON.stringify(formData),
    headers: { "Content-Type": "application/json" }
  })
  .then(res => res.json())
  .then(data => {
    if (data.result === "success") {
      alert("✅ Your query has been submitted successfully!");
      document.getElementById("contactForm").reset();
    } else {
      alert("❌ Error: " + data.error);
    }
  })
  .catch(err => alert("❌ Something went wrong: " + err));
});
</script>
{% endblock %}
